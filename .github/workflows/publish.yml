name: Sync and publish morning brief

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 08:17 and 10:17 Asia/Shanghai; the second run catches late editions.
    - cron: '17 0,2 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: morning-brief-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Sync BestBlogs and retain past editions
        run: npm run sync
        env:
          BESTBLOGS_API_KEY: ${{ secrets.BESTBLOGS_API_KEY }}
      - name: Save editions for the next scheduled run
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/briefs.json web/data
          if ! git diff --staged --quiet; then
            git commit -m "Update daily brief archive"
            git push
          fi
      - name: Build static website
        run: npm run build
        env:
          BRIEF_MODE: static
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
